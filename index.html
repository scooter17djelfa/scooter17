<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scooter 17 Store | قطع غيار واكسسوارات السكوترات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Initial Discord-Style Preloader */
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      .loader-wrapper {
        position: relative;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loader-arc-outer {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #111113;
        border-right-color: rgba(17, 17, 19, 0.4);
        animation: spinOuter 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .loader-arc-inner {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-bottom-color: #e31e24;
        border-left-color: rgba(227, 30, 36, 0.5);
        animation: spinInner 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.15s;
      }
      .loader-logo {
        position: relative;
        z-index: 2;
        width: 60px;
        height: 60px;
        object-fit: contain;
        animation: discordBreath 2s ease-in-out infinite;
      }
      @keyframes spinOuter {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinInner {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes discordBreath {
        0%, 100% { transform: scale(0.94) rotate(0deg); }
        50% { transform: scale(1.06) rotate(2deg); }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-vIw1vZ9Z.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DKcKk0NS.css">
  </head>
  <body>
    <div id="app-preloader">
      <div class="loader-wrapper">
        <div class="loader-arc-outer"></div>
        <div class="loader-arc-inner"></div>
        <img src="/logo.png" alt="Scooter 17" class="loader-logo" />
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Remove preloader once app is ready
      window.addEventListener('load', function() {
        var preloader = document.getElementById('app-preloader');
        if (preloader) {
          preloader.style.opacity = '0';
          setTimeout(function() {
            if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
          }, 350);
        }
      });
    </script>
  </body>
</html>
